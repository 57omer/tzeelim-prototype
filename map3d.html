<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>מפה תלת-ממדית | צאלים (ניסוי)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #d8cdaa; --ink: #2a2624; --noir: #1b1717; --cherry: #810100; --cotton: #edebdd; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: 'Heebo', system-ui, sans-serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
    #stage.is-drag { cursor: grabbing; }
    #stage.is-hover { cursor: pointer; }
    canvas { display: block; width: 100%; height: 100%; }
    .bar { position: fixed; z-index: 5; top: 16px; inset-inline: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
    .bar > * { pointer-events: auto; }
    .title { background: rgba(239, 233, 216, .92); border: 1px solid var(--ink); padding: 10px 16px; }
    .title small { display: block; font-size: .72rem; letter-spacing: .08em; color: var(--cherry); font-weight: 500; }
    .title h1 { margin: 2px 0 0; font-weight: 300; font-size: clamp(1.15rem, 1rem + .8vw, 1.7rem); }
    .back { background: var(--noir); color: var(--cotton); text-decoration: none; padding: 10px 16px; font-size: .85rem; border: 1px solid var(--noir); }
    .back:hover { background: var(--cherry); border-color: var(--cherry); }
    .ctrl { position: fixed; z-index: 5; bottom: 18px; inset-inline-start: 16px; display: grid; gap: 0; border: 1px solid var(--ink); background: var(--paper); }
    .ctrl button { width: 42px; height: 42px; border: 0; border-bottom: 1px solid var(--ink); background: transparent; color: var(--ink); font: 400 20px/1 'Heebo', sans-serif; cursor: pointer; }
    .ctrl button:last-child { border-bottom: 0; }
    .ctrl button:hover { background: var(--ink); color: var(--paper); }
    .legend { position: fixed; z-index: 5; bottom: 18px; inset-inline-end: 16px; display: flex; gap: 16px; font-size: .8rem; background: rgba(239, 233, 216, .92); border: 1px solid var(--ink); padding: 8px 14px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--cherry); margin-inline-end: 6px; vertical-align: -1px; }
    .legend i.is-past { background: var(--ink); }
    .hint { background: rgba(239,233,216,.9); padding: 3px 8px; position: fixed; z-index: 4; bottom: 70px; inset-inline-end: 16px; font-size: .72rem; color: #5b554d; }
    .lab { position: fixed; z-index: 3; left: 0; top: 0; transform: translate(-50%, 0); pointer-events: none; white-space: nowrap; font-size: 11px; font-weight: 500; letter-spacing: .02em; padding: 3px 8px; background: var(--noir); color: var(--cotton); border-left: 0; display: none; }
    .lab.is-active { background: var(--cherry); }
    .card { position: fixed; z-index: 6; width: 250px; background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 14px 40px rgba(27, 23, 23, .28); display: none; transform: translate(-50%, calc(-100% - 16px)); }
    .card img { display: block; width: 100%; aspect-ratio: 3/2; object-fit: cover; background: #ddd7c2; }
    .card__body { padding: 12px 14px 14px; display: grid; gap: 4px; justify-items: start; }
    .card__badge { font-size: .7rem; padding: 2px 10px; background: var(--cherry); color: var(--cotton); }
    .card__badge.is-past { background: var(--ink); }
    .card strong { font-weight: 500; font-size: 1.1rem; }
    .card span.c { font-size: .8rem; color: #5b554d; }
    .card a { margin-top: 6px; color: var(--cherry); font-size: .85rem; text-decoration: underline; text-underline-offset: 3px; }
    .card__x { position: absolute; top: 8px; inset-inline-start: 8px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: rgba(27, 23, 23, .75); color: #fff; cursor: pointer; font-size: 16px; line-height: 1; }
    .load { position: fixed; inset: 0; display: grid; place-items: center; background: var(--paper); z-index: 9; font-weight: 300; letter-spacing: .06em; transition: opacity .6s; }
    .load.is-off { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage" aria-label="מפה תלת-ממדית של הפרויקטים"></div>
  <div class="load" id="load">בונה את העיר…</div>
  <div class="bar">
    <div class="title"><small>ניסוי · תלת-ממד</small><h1>הפרויקטים שלנו בקריות</h1></div>
    <a class="back" href="home.html#map-section">חזרה לאתר</a>
  </div>
  <div class="ctrl" aria-label="בקרת מפה">
    <button id="zin" aria-label="קרב">+</button>
    <button id="zout" aria-label="הרחק">−</button>
    <button id="rl" aria-label="סובב שמאלה" title="סובב">⟲</button>
    <button id="rr" aria-label="סובב ימינה" title="סובב">⟳</button>
  </div>
  <div class="hint">גרירה להזזה · גלגלת לזום · לחיצה על בניין לפרטים</div>
  <div class="legend"><span><i></i>בשיווק ובבנייה</span><span><i class="is-past"></i>מאוכלסים</span></div>
  <div class="card" id="card" role="dialog"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/map3d-data.js?v=2"></script>
  <script src="js/map3d.js?v=8"></script>
</body>
</html>
