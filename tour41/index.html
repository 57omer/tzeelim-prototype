<style>

   data/hot_*.json            – the outline around the whole flat in the exterior frame, one sample per source frame (24/s): [visible, x1,y1, x2,y2, …] (0..1).

   The page tells its host what is on screen:  parent gets  { source: 'tour41', event: 'ready' | 'mode', mode: 'ext' | 'tour', flat: id | null }
   and the host may drive it:                   iframe.contentWindow.postMessage({ source: 'tour41', action: 'enter', flat: 'p' }, '*')   or   { action: 'exit' }   */
const EMB = qs.get('embed') === '1' || (qs.get('embed') !== '0' && self !== top), HOVER = matchMedia('(hover:hover)').matches;
if (qs.get('title') === '0') document.body.classList.add('notitle');
let active = !(EMB && HOVER) || qs.get('go') === '1';   // go=1: the host page's own start button was just clicked            // embedded on a desktop: scrolling stays with the host page until the tour is clicked, and returns to it when the pointer leaves
const tell = (event, extra) => { if (self !== top) try { parent.postMessage({ source: 'tour41', event, ...extra }, '*'); } catch (e) {} };

/* rooms in flat-local metres [x0, x1, y0, y1]; at = the second of the source clip that shows the room best (picked by eye) */

/* garden flat: ground floor and basement side by side on one plan; below hcut the marker moves to the basement drawing (dx metres to the right) */
const MAPG = { img: 'img/plan_g.jpg', box: [-7, 0, 29.5, 16.5], top: 14, bounds: [-6.9, 14.6], dx: 17, hcut: 0.2, rooms: [

/* src = length of the source clip the path was sampled from; entry = seconds that play by themselves (the flight from the front view into the flat);

const TOURS = [
  { id: 'p', file: 'tour_p', src: 30, entry: 6.0, map: MAPP, chip: 'פנטהאוז', name: 'פנטהאוז', info: 'קומה ד׳ · מרפסות גג', pin: 'קומה ד׳ · פנטהאוז', sub: 'קומה ד׳ · פנטהאוז עם מרפסות גג' },
  { id: '5s', file: 'tour_5s', src: 20, lead: 0.4, entry: 4.4, map: MAP5, chip: '5 חדרים · דרום', name: '5 חדרים', info: 'קומה ג׳ · דרום', pin: 'ג׳ דרום · 5 חדרים', sub: 'קומה ג׳ · דירת 5 חדרים דרומית' },
  { id: '5n', file: 'tour_5n', src: 20, lead: 0.4, entry: 4.4, map: MAP5N, chip: '5 חדרים · צפון', name: '5 חדרים', info: 'קומה ג׳ · צפון', pin: 'ג׳ צפון · 5 חדרים', sub: 'קומה ג׳ · דירת 5 חדרים צפונית' },
  { id: 'g', file: 'tour_g', src: 30, lead: 0.4, entry: 6.6, map: MAPG, chip: 'דירת גן', name: 'דירת גן', info: 'קומת קרקע + מרתף', pin: 'קרקע · דירת גן + מרתף', sub: 'קומת קרקע · דירת גן עם מרתף' },
];
const NS = 'http://www.w3.org/2000/svg';
function buildMap(T) {
  const M = T.map, svg = $('mapsvg'); svg.innerHTML = ''; svg.setAttribute('viewBox', M.box.join(' ')); $('map').classList.toggle('tall', !!M.tall);
  const Y = M.flip ? y => y : y => M.top - y, el = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); return e; };
  const im = el('image', { href: M.img, x: M.box[0], y: M.box[1], width: M.box[2], height: M.box[3], preserveAspectRatio: 'none' }); im.setAttributeNS('http://www.w3.org/1999/xlink', 'href', M.img); svg.appendChild(im);
