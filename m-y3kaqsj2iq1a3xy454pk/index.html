<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>כניסה</title>
<link rel="stylesheet" href="../vendor/fonts.css">
<style>
:root{--cotton:#EDEBDD;--cherry:#810100;--maroon:#630000;--noir:#1B1717}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--noir);color:var(--cotton);font-family:"Heebo",system-ui,Arial,sans-serif}
#gate{width:min(380px,92vw);background:var(--cotton);color:var(--noir);border-radius:16px;padding:28px}
#gate h1{margin:0 0 4px;font-size:1.4rem}#gate p{margin:0 0 18px;color:#5C5650;font-size:.95rem}
label{display:block;font-weight:600;margin:12px 0 5px}
input{width:100%;padding:11px 12px;border:1px solid rgba(27,23,23,.3);border-radius:10px;font:inherit;background:#F6F4EA;min-height:44px;direction:ltr;text-align:left}
button{margin-top:18px;width:100%;min-height:46px;border:0;border-radius:10px;background:var(--cherry);color:var(--cotton);font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
#msg{min-height:1.4em;margin-top:12px;color:#9A1B14;font-size:.92rem}
:focus-visible{outline:3px solid var(--cherry);outline-offset:2px}
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <h1>כניסה</h1><p>סיסמה וקוד אימות מהאפליקציה.</p>
  <label for="pw">סיסמה</label><input id="pw" type="password" autocomplete="current-password" required>
  <label for="otp">קוד אימות (6 ספרות)</label><input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
  <button id="go" type="submit">כניסה</button>
  <div id="msg" role="alert"></div>
</form>
