<!doctype html>
<html lang="he" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ניהול האתר | צאלים</title>

<link rel="stylesheet" href="admin.css?v=3">

<body>
<header class="top">
  <div class="top__brand"><img src="../img/brand/logo-white.png" alt="" onerror="this.remove()"><strong>ניהול האתר</strong></div>
  <nav class="top__nav" aria-label="מודולים"></nav>
  <div class="top__actions">
    <span class="dirty" id="dirty" hidden></span>
